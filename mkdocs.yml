site_name: Portable by Design Tutorial
site_description: Hands-on materials for portable, reproducible scientific workflows with TaskVine, Sciunit, and Floability.

docs_dir: docs

markdown_extensions:
  - admonition

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

nav:
